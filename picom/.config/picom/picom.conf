backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.7;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

wintypes:
{
  tooltip = { fade = true; shadow = true; };
  menu = { shadow = true; };
  dropdown_menu = { shadow = true; };
  popup_menu = { shadow = true; };
};

# Rounded corners
corner-radius = 12;
round-borders = 1;

# Transparency
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 0.9;

# Blur (requires experimental-backends)
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;

# NVIDIA fix
unredir-if-possible = false;

